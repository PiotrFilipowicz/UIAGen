<svg xmlns="http://w3.org" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <!-- Tło główne banera -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Gradient tła ikony -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Gradient prawego ramienia U -->
    <linearGradient id="rightArmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Akcenty poziome -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtelna siatka techniczna w tle -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Tło i siatka -->
  <rect width="1280" height="320" rx="16" fill="url(#bannerBg)" />
  <rect width="1280" height="320" rx="16" fill="url(#grid)" />

  <!-- LEWA SEKCJA: Monogram U przy lewym marginesie -->
  <g transform="translate(44, 64) scale(0.75)">
    <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#iconBgGrad)" stroke="#818CF8" stroke-width="3" stroke-opacity="0.45" />
    <rect x="24" y="24" width="208" height="208" rx="40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.1" />
    
    <!-- Lewa część litery U -->
    <path d="M 72 68 H 106 V 142 C 106 154 114 162 126 162 H 142 V 194 H 118 C 90 194 72 176 72 146 Z" fill="#FFFFFF" />
    
    <!-- Prawa część litery U -->
    <path d="M 150 68 H 184 V 146 C 184 176 166 194 138 194 H 130 V 162 H 134 C 144 162 150 154 150 142 Z" fill="url(#rightArmGrad)" />
    
    <!-- Szczelina techniczna -->
    <rect x="132" y="160" width="6" height="36" fill="#311068" />
  </g>

  <!-- ŚRODKOWA SEKCJA: Główna typografia i luźniej rozstawione odznaki -->
  <g transform="translate(265, 0)">
    <!-- Tytuł -->
    <text x="0" y="128" font-family="sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      UIA <tspan fill="url(#accentGrad)" font-weight="400">|</tspan> <tspan font-family="monospace" font-size="52" font-weight="700" fill="#38BDF8">uiagen</tspan>
    </text>

    <!-- Podtytuł -->
    <text x="2" y="178" font-family="sans-serif" font-size="21" font-weight="500" fill="#CBD5E1">
      Universal Interop Assembly — COM Adapters for Native AOT
    </text>

    <!-- Odznaki technologiczne z większym luzem wewnętrznym i większymi odstępami -->
    <g transform="translate(2, 214)" font-family="monospace" font-size="18" font-weight="600">
      <!-- Badge 1: .NET 10 -->
      <rect x="0" y="0" width="118" height="36" rx="18" fill="#512BD4" fill-opacity="0.5" stroke="#818CF8" stroke-width="1.5" />
      <text x="59" y="23" fill="#FFFFFF" text-anchor="middle">.NET 10</text>

      <!-- Badge 2: Native AOT -->
      <rect x="138" y="0" width="150" height="36" rx="18" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5" />
      <text x="213" y="23" fill="#38BDF8" text-anchor="middle">Native AOT</text>

      <!-- Badge 3: COM Interop -->
      <rect x="308" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <text x="388" y="23" fill="#E2E8F0" text-anchor="middle">COM Interop</text>

      <!-- Badge 4: CLI Tool -->
      <rect x="488" y="0" width="132" height="36" rx="18" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <text x="554" y="23" fill="#E2E8F0" text-anchor="middle">CLI Tool</text>
    </g>
  </g>

  <!-- PRAWA SEKCJA: Schemat przepływu zamykający kompozycję -->
  <g transform="translate(990, 68)" font-family="monospace" font-size="18" font-weight="600">
    <!-- Karta wejściowa (COM / TLB) -->
    <rect x="0" y="0" width="246" height="46" rx="10" fill="#1E293B" fill-opacity="0.85" stroke="#64748B" stroke-width="1.5" />
    <circle cx="22" cy="23" r="5" fill="#94A3B8" />
    <text x="40" y="28" fill="#E2E8F0">COM / TLB Metadata</text>

    <!-- Strzałka łącząca w dół -->
    <line x1="123" y1="46" x2="123" y2="70" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3" />
    <polygon points="118,68 128,68 123,75" fill="#38BDF8" />

    <!-- Karta środkowa (Generator) -->
    <rect x="28" y="76" width="190" height="40" rx="20" fill="#512BD4" fill-opacity="0.6" stroke="#818CF8" stroke-width="1.5" />
    <text x="123" y="101" fill="#FFFFFF" text-anchor="middle">&gt;_ uiagen</text>

    <!-- Strzałka łącząca w dół -->
    <line x1="123" y1="116" x2="123" y2="140" stroke="#38BDF8" stroke-width="2" />
    <polygon points="118,138 128,138 123,145" fill="#38BDF8" />

    <!-- Karta wyjściowa (Native AOT C#) -->
    <rect x="0" y="146" width="246" height="46" rx="10" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="22" cy="169" r="5" fill="#38BDF8" />
    <text x="40" y="174" fill="#38BDF8">Zero-Reflection AOT</text>
  </g>
</svg>
